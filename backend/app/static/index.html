<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Workbench</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #111827;
            --bg-card-header: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --status-green: #10b981;
            --status-red: #ef4444;
            --status-warn: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .airgap-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--status-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        /* Layout Grid */
        .workbench-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(100vh - 140px);
        }

        .card-header {
            background-color: var(--bg-card-header);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        .card-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Chat / Live Stream Terminal */
        #chatBox {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #d1d5db;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #6b7280;
        }

        .log-entry.user {
            border-left-color: var(--accent-blue);
            color: #93c5fd;
        }

        .log-entry.system {
            border-left-color: var(--accent-cyan);
            color: #a5f3fc;
        }

        .log-entry.sandbox {
            border-left-color: var(--status-warn);
            color: #fde68a;
        }

        /* Deliverable Download Card */
        .deliverable-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .deliverable-link {
            background-color: var(--accent-blue);
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .deliverable-link:hover {
            background-color: #1d4ed8;
        }

        /* Card Input Toolbar */
        .input-bar {
            padding: 14px;
            background-color: var(--bg-card-header);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        select, input, button {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        input {
            flex: 1;
        }

        button {
            background: var(--accent-blue);
            font-weight: 600;
            cursor: pointer;
            border: none;
            padding: 8px 18px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .btn-refresh {
            background: #374151;
            padding: 4px 10px;
            font-size: 11px;
        }

        .btn-refresh:hover {
            background: #4b5563;
        }

        /* Table Design */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #d1d5db;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Sovereign AI Workbench</h1>
            <p>Air-Gapped Industrial Verification Platform</p>
        </div>
        <div id="airgapBadge" class="airgap-badge">
            <span class="badge-dot"></span>
            <span id="airgapText">Checking Network...</span>
        </div>
    </header>

    <div class="workbench-grid">
        <!-- Live Agent Chat & Tool Sandbox Section -->
        <div class="card">
            <div class="card-header">
                <span>Live Agent Streaming (WebSocket)</span>
            </div>
            <div class="card-body" id="chatBox">
                <div class="log-entry system">Workbench initialized. Ready for isolated verification workflows.</div>
            </div>
            <div class="input-bar">
                <select id="taskType">
                    <option value="general">General Query</option>
                    <option value="sandbox_excel">Engineering / CGPA Calc (.xlsx)</option>
                    <option value="docx_memo">Inspection Approval Memo (.docx)</option>
                    <option value="pptx_presentation">Executive Presentation (.pptx)</option>
                    <option value="pdf_report">Compliance Audit Report (.pdf)</option>
                </select>
                <input type="text" id="promptInput" placeholder="Enter task or instruction (e.g., generate cgpa calculator)..." onkeydown="handleKeyPress(event)" />
                <button onclick="sendTask()">Send</button>
            </div>
        </div>

        <!-- Audit Trail / SQLite Log DB -->
        <div class="card">
            <div class="card-header">
                <span>Audit Log DB</span>
                <div style="display: flex; gap: 6px;">
                    <a href="/api/audit/export" download="sovereign_audit_trail.csv" class="btn-refresh" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center;">📥 CSV</a>
                    <button class="btn-refresh" onclick="fetchAuditLogs()">Refresh</button>
                </div>
            </div>
            <div class="card-body" style="padding: 0;">
                <table>
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditTableBody">
                        <tr>
                            <td colspan="3" style="text-align: center; color: var(--text-muted);">Loading audit trails...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const host = window.location.host;
        const protocol = window.location.protocol === "https:" ? "https:" : "http:";
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        let ws;

        // 1. Initialize WebSocket Connection
        function connectWS() {
            ws = new WebSocket(`${wsProtocol}//${host}/api/chat/ws`);

            ws.onopen = () => {
                appendLog("System", "Connected to local streaming agent WebSocket.", "system");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Display agent thoughts or output
                    if (data.message) {
                        appendLog(data.sender || "Agent", data.message, data.type || "system");
                    }

                    // Handle generated deliverable files
                    if (data.file_url) {
                        appendDeliverable(data.filename || "Deliverable", data.file_url);
                        fetchAuditLogs(); // Refresh DB when deliverable generated
                    }
                } catch (e) {
                    appendLog("Agent", event.data, "system");
                }
            };

            ws.onclose = () => {
                appendLog("System", "WebSocket disconnected. Reconnecting in 3s...", "system");
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket Error:", err);
            };
        }

        // 2. Dispatch Task to Agent
        function sendTask() {
            const input = document.getElementById("promptInput");
            const taskType = document.getElementById("taskType").value;
            const prompt = input.value.trim();

            if (!prompt) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("WebSocket is not connected. Please ensure backend is running.");
                return;
            }

            appendLog("User", `[${taskType}] ${prompt}`, "user");

            ws.send(JSON.stringify({
                prompt: prompt,
                task_type: taskType
            }));

            input.value = "";
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendTask();
            }
        }

        // 3. UI Helpers: Logs and Deliverables
        function appendLog(sender, text, type) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `log-entry ${type}`;
            div.innerHTML = `<strong>${sender}:</strong> ${escapeHtml(text)}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendDeliverable(filename, url) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "deliverable-box";
            div.innerHTML = `
                <div>
                    <strong>Deliverable Ready:</strong>
                    <div style="color: var(--text-muted); font-size: 11px;">${escapeHtml(filename)}</div>
                </div>
                <a href="${url}" download class="deliverable-link">
                    📥 Download File
                </a>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 4. Airgap Monitor Polling
        async function checkAirgap() {
            const badge = document.getElementById("airgapBadge");
            const text = document.getElementById("airgapText");

            try {
                const res = await fetch(`${protocol}//${host}/api/security/network-status`);
                const data = await res.json();

                if (data.is_airgapped) {
                    badge.style.background = "rgba(16, 185, 129, 0.15)";
                    badge.style.color = "var(--status-green)";
                    badge.style.borderColor = "rgba(16, 185, 129, 0.3)";
                    text.innerText = "100% AIR-GAPPED (0 EGRESS)";
                } else {
                    badge.style.background = "rgba(239, 68, 68, 0.15)";
                    badge.style.color = "var(--status-red)";
                    badge.style.borderColor = "rgba(239, 68, 68, 0.3)";
                    text.innerText = "WARNING: NETWORK ACTIVE";
                }
            } catch (err) {
                console.warn("Airgap check failed:", err);
            }
        }

        // 5. Fetch SQLite Audit Logs
        async function fetchAuditLogs() {
            const tbody = document.getElementById("auditTableBody");

            try {
                const res = await fetch(`${protocol}//${host}/api/audit/logs`);
                const logs = await res.json();

                if (!Array.isArray(logs) || logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No logs recorded.</td></tr>`;
                    return;
                }

                tbody.innerHTML = logs.slice(-15).reverse().map(log => `
                    <tr>
                        <td style="font-weight: 600;">${escapeHtml(log.action || 'Event')}</td>
                        <td><span style="color: ${log.status === 'SUCCESS' ? 'var(--status-green)' : 'var(--status-warn)'};">${escapeHtml(log.status || 'INFO')}</span></td>
                        <td style="color: var(--text-muted); font-size: 11px;">${escapeHtml(log.details || '-')}</td>
                    </tr>
                `).join("");
            } catch (err) {
                console.warn("Audit log fetch failed:", err);
            }
        }

        // Run on Page Load
        window.addEventListener("DOMContentLoaded", () => {
            connectWS();
            checkAirgap();
            fetchAuditLogs();
            setInterval(checkAirgap, 5000);
        });
    </script>
</body>
</html>
