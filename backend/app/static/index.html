<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sovereign AI Workbench - Diagnostic UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
    .badge { padding: 6px 14px; border-radius: 9999px; font-weight: 600; font-size: 13px; letter-spacing: 0.5px; }
    .badge-green { background: #166534; color: #86efac; border: 1px solid #22c55e; }
    .badge-red { background: #991b1b; color: #fca5a5; border: 1px solid #ef4444; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .panel { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 18px; display: flex; flex-direction: column; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    #chat-box { height: 360px; overflow-y: auto; background: #0b0f19; border: 1px solid #334155; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 6px; font-size: 14px; max-width: 90%; }
    .msg-user { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg-thought { background: #334155; color: #cbd5e1; font-style: italic; font-size: 12px; align-self: flex-start; }
    .msg-tool { background: #064e3b; color: #6ee7b7; border-left: 3px solid #10b981; align-self: flex-start; }
    .msg-bot { background: #1e293b; color: #f8fafc; border: 1px solid #475569; align-self: flex-start; }
    .input-row { display: flex; gap: 8px; margin-top: 12px; }
    input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; }
    input { flex: 1; }
    button { background: #2563eb; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    .download-btn { display: inline-block; margin-top: 6px; padding: 6px 10px; background: #059669; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Sovereign AI Workbench</h1>
      <small style="color: #64748b;">Air-Gapped Industrial Verification Platform</small>
    </div>
    <div id="airgap-badge" class="badge badge-green">CHECKING NETWORK...</div>
  </div>

  <div class="grid">
    <!-- Left Panel: Chat & Streaming Tools -->
    <div class="panel">
      <h2>Live Agent Streaming (WebSocket)</h2>
      <div id="chat-box"></div>
      <div class="input-row">
        <select id="task-select">
          <option value="general">General Query</option>
          <option value="coding">Engineering Calculation (Sandbox)</option>
          <option value="inspection_summary">Inspection Approval Memo (.docx)</option>
        </select>
        <input type="text" id="prompt-input" placeholder="Type engineering request..." value="Calculate safety factor for piping valve V-204" />
        <button onclick="sendTask()">Send</button>
      </div>
    </div>

    <!-- Right Panel: Live Security Audit Logs -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>Audit Log DB</h2>
        <button onclick="fetchAuditLogs()" style="padding: 4px 8px; font-size: 11px;">Refresh</button>
      </div>
      <div style="height: 360px; overflow-y: auto;">
        <table>
          <thead>
            <tr><th>Action</th><th>Status</th><th>Details</th></tr>
          </thead>
          <tbody id="audit-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let ws;
    const chatBox = document.getElementById("chat-box");

    function connectWS() {
      ws = new WebSocket("ws://" + window.location.host + "/api/chat/ws");
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "thought") {
          appendMessage(data.message, "msg-thought");
        } else if (data.type === "tool_step") {
          appendMessage("⚙️ " + data.step, "msg-tool");
        } else if (data.type === "message") {
          let html = data.content;
          if (data.deliverable_url) {
            html += `<br><a class="download-btn" href="${data.deliverable_url}" target="_blank">📥 Download Deliverable File</a>`;
          }
          appendMessage(html, "msg-bot", true);
          fetchAuditLogs();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    function appendMessage(text, className, isHTML = false) {
      const msg = document.createElement("div");
      msg.className = "msg " + className;
      if (isHTML) msg.innerHTML = text; else msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendTask() {
      const input = document.getElementById("prompt-input");
      const taskType = document.getElementById("task-select").value;
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage(prompt, "msg-user");
      ws.send(JSON.stringify({ prompt: prompt, task_type: taskType }));
      input.value = "";
    }

    async function checkAirgap() {
      try {
        const res = await fetch("/api/security/network-status");
        const data = await res.json();
        const badge = document.getElementById("airgap-badge");
        if (data.app_isolated) {
          badge.className = "badge badge-green";
          badge.textContent = "● 100% AIR-GAPPED (0 EGRESS)";
        } else {
          badge.className = "badge badge-red";
          badge.textContent = "⚠ EXTERNAL CALLS DETECTED";
        }
      } catch (e) {
        console.error("Airgap check failed", e);
      }
    }

    async function fetchAuditLogs() {
      try {
        const res = await fetch("/api/audit/logs");
        const logs = await res.json();
        const tbody = document.getElementById("audit-table-body");
        tbody.innerHTML = "";
        logs.slice(0, 10).forEach(log => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td><b>${log.action_type}</b></td><td style="color:${log.status==='SUCCESS'?'#86efac':'#fca5a5'}">${log.status}</td><td>${log.details}</td>`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error("Audit log fetch failed", e);
      }
    }

    connectWS();
    checkAirgap();
    fetchAuditLogs();
    setInterval(checkAirgap, 5000);
  </script>
</body>
</html>
